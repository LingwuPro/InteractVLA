[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactvla"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "pillow"]

[project.optional-dependencies]
pi05 = ["jax", "flax"]
test = ["pytest", "jax"]

[project.scripts]
interactvla = "interactvla.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["interactvla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
